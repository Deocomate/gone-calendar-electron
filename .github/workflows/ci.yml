name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Unit tests stub the `electron` module (see tests/stubs/electron.ts) and
      # nothing here packages the app, so skip the ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.5 added node:sqlite behind a flag; it's unflagged from 23.4 on. The DB
          # tests require() it directly (src/main/db/sqlite-driver.ts), and the repo
          # doesn't declare better-sqlite3 as a fallback dependency, so CI's Node must
          # actually have it built in, not just be "recent enough" to build the app.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
